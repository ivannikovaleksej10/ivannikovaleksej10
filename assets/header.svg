<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-label="tools and toys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140d12"/>
      <stop offset="45%" stop-color="#1b1016"/>
      <stop offset="100%" stop-color="#0c0a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8a0ab" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#8a3d55" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8a3d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#6ea8d8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6ea8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d0d4"/>
      <stop offset="100%" stop-color="#d98996"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#glow)"/>
  <rect width="1600" height="460" fill="url(#glow2)"/>
  <rect width="1600" height="460" fill="url(#dots)"/>

  <rect x="0" y="0" width="1600" height="1" fill="#f3d0d4" opacity="0.18"/>
  <rect x="80" y="392" width="240" height="1" fill="#f3d0d4" opacity="0.35"/>

  <g transform="translate(96,148)" fill="none" stroke="url(#mark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 112 L68 8 L128 112" opacity="0.95"/>
    <path d="M48 112 L108 8 L168 112" opacity="0.55"/>
  </g>

  <text x="300" y="205" fill="#f7ecee" font-family="Inter, ui-sans-serif, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="6">TOOLS &amp; TOYS</text>
  <text x="300" y="258" fill="#c9a0a7" font-family="Inter, ui-sans-serif, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="4">browser · desktop · tiny scripts</text>
  <text x="300" y="318" fill="#8f7a80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">// things I wanted within reach</text>
</svg>
